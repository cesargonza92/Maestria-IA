name: data-streaming-proyecto-integrador

services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.raw --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic transactions.processed --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic fraud.alerts --partitions 3 --replication-factor 1 --config cleanup.policy=compact &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic invalid.events --partitions 3 --replication-factor 1
      "

  jobmanager:
    image: flink:1.17-scala_2.12-java11
    container_name: flink-jobmanager
    command: jobmanager
    network_mode: host
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: localhost
        jobmanager.bind-host: 0.0.0.0
        rest.address: 0.0.0.0
        rest.bind-address: 0.0.0.0
        jobmanager.memory.process.size: 1024m
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8081/overview >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  taskmanager:
    build:
      context: .
      dockerfile: flink/taskmanager.Dockerfile
    container_name: flink-taskmanager
    command: taskmanager
    network_mode: host
    user: root
    depends_on:
      jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: localhost
        taskmanager.host: localhost
        taskmanager.numberOfTaskSlots: 2

        taskmanager.memory.process.size: 2048m
        taskmanager.memory.jvm-metaspace.size: 512m
        taskmanager.memory.framework.off-heap.size: 256m
        taskmanager.memory.task.off-heap.size: 256m

        classloader.check-leaked-classloader: false

        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 5
        restart-strategy.fixed-delay.delay: 10 s
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - beam_artifact_staging:/tmp/beam-artifact-staging

  beam_flink_job_server:
    image: apache/beam_flink1.17_job_server:2.61.0
    container_name: beam-flink-job-server
    network_mode: host
    command:
      - "--job-host=localhost"
      - "--flink-master=localhost:8081"
      - "--job-port=8099"
      - "--artifact-port=8098"
      - "--expansion-port=8097"
      - "--artifacts-dir=/tmp/beam-artifact-staging"
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
    volumes:
      - beam_artifact_staging:/tmp/beam-artifact-staging

  beam_pipeline:
    build:
      context: .
      dockerfile: beam_pipeline/Dockerfile
    container_name: beam_pipeline
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      beam_flink_job_server:
        condition: service_started
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - "--bootstrap-servers=localhost:29092"
      - "--runner=flink"
      - "--job-endpoint=localhost:8099"
    volumes:
      - beam_expansion_cache:/root/.apache_beam
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: producer/Dockerfile
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - "--bootstrap-servers=kafka:9092"
      - "--profiles=normal,duplicates,late,alerting"
      - "--count=30"
      - "--seed=42"

  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    profiles: ["tools"]
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      PYTHONUNBUFFERED: "1"
    command:
      - "--bootstrap-servers=kafka:9092"
      - "--timeout-ms=25000"

volumes:
  beam_expansion_cache:
  beam_artifact_staging:
